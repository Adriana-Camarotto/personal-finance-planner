<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#coinGradient)" stroke="#1B5E20" stroke-width="2"/>

  <!-- Coin shine/gloss effect -->
  <ellipse cx="35" cy="35" rx="20" ry="18" fill="url(#glossGradient)"/>

  <!-- Dollar sign -->
  <g transform="translate(50, 50)">
    <!-- Vertical lines of $ -->
    <line x1="-2" y1="-12" x2="-2" y2="12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Top curve -->
    <path d="M -8 -6 Q -2 -10 4 -6" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle curve -->
    <path d="M -8 2 Q -2 -2 4 2" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom curve -->
    <path d="M -8 10 Q -2 6 4 10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>