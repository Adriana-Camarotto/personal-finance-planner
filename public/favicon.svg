<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13234e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#coinGradient)" stroke="#0f172a" stroke-width="2"/>

  <!-- Coin shine/gloss effect -->
  <ellipse cx="35" cy="35" rx="20" ry="18" fill="url(#glossGradient)"/>

  <!-- Pound sign £ -->
  <text x="50" y="62" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">£</text>
</svg>